[package]
name = "antigravity-keepawake"
version = "0.1.0"
edition = "2024"

[lib]
name = "antigravity_keepawake"
path = "src/lib.rs"

[[bin]]
name = "antigravity-keepawake"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "test-util"] }
zbus = { version = "5", features = ["tokio"] }
notify = "6"
sysinfo = "0.33"
nix = { version = "0.29", features = ["signal", "process", "user"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"
